[project]
name = "doppelganger"
version = "0.1.0"
description = "ML synth sound-matching for Ableton Operator: data tools, training, and inference export."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

# Optional dependency groups, installed on demand:
#   uv sync --extra datagen   -> Windows GUI automation for Ableton export
#   uv sync --extra train     -> the ML training stack (added later)
[project.optional-dependencies]
datagen = [
    "pywinauto>=0.6.9 ; sys_platform == 'win32'",
]
train = [
    "torch>=2.2",
    "scipy>=1.11",
    "tensorboard>=2.16",
]

# Train on CUDA (GPU). The exported ONNX model is device-agnostic and still runs on
# CPU for end users — training device and deployment device are independent.
[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doppelganger"]
