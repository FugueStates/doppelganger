[project]
name = "doppelganger"
version = "0.1.0"
description = "ML synth sound-matching for Ableton Operator: data tools, training, and inference export."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

# Optional dependency groups, installed on demand:
#   uv sync --extra datagen   -> Windows GUI automation for Ableton export
#   uv sync --extra train     -> the ML training stack (added later)
[project.optional-dependencies]
datagen = [
    "pywinauto>=0.6.9 ; sys_platform == 'win32'",
]
train = [
    "torch>=2.2",
    "scipy>=1.11",
    "tensorboard>=2.16",
    "cma>=3.3",
]

# Train on CUDA (GPU). The exported ONNX model is device-agnostic and still runs on
# CPU for end users — training device and deployment device are independent.
[tool.uv.sources]
torch = { index = "pytorch-cuda" }

# cu124 matches the 2x3090 (CUDA 12.4) box and still runs on the 4070 dev machine
# (a cu128 wheel needs a ~CUDA-12.8 driver, which a 12.4 box does not have).
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doppelganger"]
